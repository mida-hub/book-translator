[project]
name = "book-translator"
version = "1.0.0"
description = "Kindle 英語読書補助用 Mac ローカル翻訳アプリ"
requires-python = ">=3.12"
dependencies = [
    "PyQt6>=6.4.0",
    "pyobjc-framework-Vision>=9.0",
    "pyobjc-framework-Quartz>=9.0",
    "pyobjc-framework-Cocoa>=9.0",
    "Pillow>=10.0.0",
    "mss>=9.0.0",
    "pynput>=1.7.6",
]
